services:
  web:
    build: .
    container_name: kinohub
    ports:
      - 8000:8000
    volumes:
      - .:/app
    env_file:
      - ./.env.dev
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres:18.3
    container_name: postgres_db
    ports:
      - 5433:5432
    volumes:
      - postgres_db:/var/lib/postgresql
    environment:
      - POSTGRES_USER=justdawy
      - POSTGRES_PASSWORD=justdawy
      - POSTGRES_DB=kinohub
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s


volumes:
  postgres_db:
