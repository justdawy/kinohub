[project]
name = "kinohub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.0",
    "django==6.0.2",
    "django-allauth>=65.14.1",
    "django-countries[pyuca]>=8.2.0",
    "gunicorn>=25.3.0",
    "pillow>=12.1.1",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "python-slugify>=8.0.4",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "djlint>=1.36.4",
    "pre-commit>=4.5.1",
    "ruff>=0.15.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/settings/*.py" = ["F403", "F405"]
"**/migrations/*.py" = ["E501"]
