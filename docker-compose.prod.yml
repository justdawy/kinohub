services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    entrypoint: []
    working_dir: /app/kinohub
    command: uv run gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/kinohub/staticfiles
      - media_volume:/app/kinohub/mediafiles
    expose:
      - 8000
    env_file:
      - ./.env.prod
    depends_on:
      db:
        condition: service_healthy
        restart: true
  db:
    image: postgres:18.3
    container_name: postgres_db
    ports:
      - 5433:5432
    volumes:
      - postgres_db:/var/lib/postgresql
    env_file:
      - ./.env.prod.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
  nginx:
    build: ./nginx
    ports:
      - 1337:80
    volumes:
      - static_volume:/app/kinohub/staticfiles
      - media_volume:/app/kinohub/mediafiles
    depends_on:
      - web


volumes:
  postgres_db:
  static_volume:
  media_volume:
