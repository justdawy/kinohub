<!-- Card -->
<div class="col-auto">
    <a class="text-decoration-none" href="{{ movie.get_absolute_url }}">
        <div class="film-card">
            <div class="film-poster">
                <img src="{{ movie.image_url }}" alt="">
                <!-- Play button -->
                <div class="play-overlay">
                    <i class="fa fa-play"></i>
                </div>
                <!-- Badge -->
                <!--<span class="badge badge-top">1 сезон</span>-->
                <span class="badge badge-top" style="top: 8px;">{{ movie.full_quality }}</span>
                <span class="badge badge-top" style="top: 32px;">IMDB: {{ movie.imdb }}</span>
            </div>
            <!-- Title  card-body -->
            <div class="film-body">
                <div class="film-title ">{{ movie.title }}</div>
            </div>
        </div>
    </a>
</div>
